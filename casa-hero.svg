<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Ilustración de una casa en venta con jardín">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f4ed"/>
      <stop offset="1" stop-color="#e4ebe6"/>
    </linearGradient>
    <linearGradient id="muro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbf7"/>
      <stop offset="1" stop-color="#f1ece1"/>
    </linearGradient>
  </defs>

  <!-- Cielo y sol -->
  <rect width="400" height="500" fill="url(#cielo)"/>
  <circle cx="312" cy="116" r="72" fill="#b98a2e" opacity=".14"/>
  <circle cx="312" cy="116" r="44" fill="#b98a2e" opacity=".12"/>

  <!-- Suelo -->
  <rect x="0" y="380" width="400" height="120" fill="#e3ded2"/>
  <rect x="0" y="380" width="400" height="9" fill="#d6cfbe"/>
  <polygon points="176,388 214,388 240,470 150,470" fill="#dcd5c6"/>
  <ellipse cx="196" cy="383" rx="142" ry="11" fill="#17513f" opacity=".07"/>

  <!-- Árbol -->
  <rect x="52" y="300" width="11" height="84" rx="3" fill="#7b6b52"/>
  <circle cx="58" cy="288" r="33" fill="#17513f" opacity=".88"/>
  <circle cx="33" cy="306" r="23" fill="#17513f" opacity=".78"/>
  <circle cx="83" cy="304" r="25" fill="#17513f" opacity=".82"/>

  <!-- Chimenea (detrás del techo) -->
  <rect x="246" y="136" width="24" height="44" fill="#0e3629"/>
  <rect x="241" y="130" width="34" height="9" rx="2" fill="#b98a2e"/>

  <!-- Cuerpo de la casa -->
  <rect x="100" y="215" width="192" height="169" fill="url(#muro)"/>
  <rect x="100" y="215" width="192" height="169" fill="none" stroke="#e2dacb" stroke-width="1"/>

  <!-- Techo -->
  <polygon points="78,216 196,128 314,216" fill="#17513f"/>
  <rect x="78" y="216" width="236" height="9" fill="#b98a2e"/>

  <!-- Ventanas superiores -->
  <g>
    <rect x="128" y="245" width="48" height="46" rx="2" fill="#f3ddb0"/>
    <rect x="128" y="245" width="48" height="46" rx="2" fill="none" stroke="#17513f" stroke-width="3"/>
    <path d="M152 245v46M128 268h48" stroke="#fdfbf7" stroke-width="3"/>
    <rect x="216" y="245" width="48" height="46" rx="2" fill="#f3ddb0"/>
    <rect x="216" y="245" width="48" height="46" rx="2" fill="none" stroke="#17513f" stroke-width="3"/>
    <path d="M240 245v46M216 268h48" stroke="#fdfbf7" stroke-width="3"/>
  </g>

  <!-- Ventanas inferiores -->
  <g>
    <rect x="118" y="312" width="42" height="44" rx="2" fill="#f3ddb0"/>
    <rect x="118" y="312" width="42" height="44" rx="2" fill="none" stroke="#17513f" stroke-width="3"/>
    <path d="M139 312v44" stroke="#fdfbf7" stroke-width="3"/>
    <rect x="232" y="312" width="42" height="44" rx="2" fill="#f3ddb0"/>
    <rect x="232" y="312" width="42" height="44" rx="2" fill="none" stroke="#17513f" stroke-width="3"/>
    <path d="M253 312v44" stroke="#fdfbf7" stroke-width="3"/>
  </g>

  <!-- Puerta -->
  <rect x="168" y="304" width="56" height="7" rx="2" fill="#b98a2e"/>
  <path d="M176 384v-58a20 20 0 0 1 40 0v58Z" fill="#17513f"/>
  <circle cx="208" cy="352" r="3.6" fill="#b98a2e"/>
  <rect x="166" y="376" width="60" height="9" rx="3" fill="#d6cfbe"/>

  <!-- Arbustos -->
  <circle cx="112" cy="374" r="16" fill="#17513f" opacity=".72"/>
  <circle cx="133" cy="379" r="11" fill="#17513f" opacity=".6"/>
  <circle cx="276" cy="376" r="14" fill="#17513f" opacity=".72"/>
  <circle cx="294" cy="380" r="10" fill="#17513f" opacity=".6"/>

  <!-- Cartel EN VENTA -->
  <rect x="330" y="398" width="6" height="72" rx="2" fill="#7b6b52"/>
  <rect x="301" y="382" width="64" height="34" rx="4" fill="#17513f"/>
  <text x="333" y="401" text-anchor="middle" fill="#f1ede6" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2">EN VENTA</text>
  <rect x="312" y="406" width="42" height="2" fill="#b98a2e"/>
</svg>
